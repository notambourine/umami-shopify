name: notambourine

# Keep this name and the job IDs stable: required checks use them.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fleet-actions:
    permissions:
      contents: read
    uses: notambourine/fleet-actions/.github/workflows/fleet-ci.yml@3b6ab5d2b588283e483fe678df9fe255a44921ca # v1.11.0
    with:
      runs-on: blacksmith-2vcpu-ubuntu-2404
      vet: true
      # npm repo; corepack pins nothing here.
      pnpm-pin: false

  socket-tree:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      # Socket's malicious verdict is age-independent, so a too-fresh transitive must not fail the job.
      - run: sfw npm ci
        env:
          npm_config_min_release_age: "0"
